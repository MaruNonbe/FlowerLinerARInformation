<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Nagai AR Guide – Audio Button + Debug Toggle</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

  <!-- AR.js (GPS + Camera) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex-location-only.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }

    /* 言語切替 */
    #lang-switch {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      z-index: 9999;
      cursor: pointer;
    }

    /* デバッグ ON/OFF ボタン */
    #debugToggle {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-size: 12px;
      color: #0f0;
      z-index: 9999;
      cursor: pointer;
      border: 1px solid #0f0;
    }

    /* 下部プレート */
    #spotPlate {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 12px;
      z-index: 9998;
      display: none;
    }

    #spotHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    #spotTitle {
      font-size: 18px;
      font-weight: bold;
    }

    #audioGuideBtn {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      white-space: nowrap;
    }

    #audioGuideBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #spotScrollWindow {
      overflow: hidden;
      height: 120px;
    }

    #spotScrollContent {
      white-space: pre-wrap;
      line-height: 1.4;
      transform: translateY(0);
    }

    /* デバッグパネル */
    #debugPanel {
      position: fixed;
      top: 50px;
      left: 10px;
      padding: 6px 8px;
      font-size: 10px;
      line-height: 1.3;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      z-index: 9999;
      max-width: 80vw;
      max-height: 40vh;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="lang-switch">日本語 / English</div>
<button id="debugToggle">DEBUG</button>
<div id="debugPanel">GPS: waiting...</div>

<!-- 下部説明プレート -->
<div id="spotPlate">
  <div id="spotHeader">
    <div id="spotTitle"></div>
    <button id="audioGuideBtn">▶ 音声ガイド</button>
  </div>
  <div id="spotScrollWindow">
    <div id="spotScrollContent"></div>
  </div>
</div>

<!-- 共通オーディオ（非表示） -->
<audio id="spotAudio" preload="auto"></audio>

<script>
/* ============================================================
   0. デバッグ & エラーキャッチ
============================================================ */
function dbg(msg) {
  const el = document.getElementById("debugPanel");
  if (!el) return;
  const now = new Date().toLocaleTimeString();
  el.textContent = `[${now}] ${msg}\n` + el.textContent;
}
window.onerror = function (msg, src, line, col, err) {
  dbg(`JS ERROR: ${msg} @${line}:${col}`);
};

dbg("script start");

/* デバッグパネル ON/OFF */
let debugVisible = true;
const debugPanelEl = document.getElementById("debugPanel");
document.getElementById("debugToggle").addEventListener("click", () => {
  debugVisible = !debugVisible;
  debugPanelEl.style.display = debugVisible ? "block" : "none";
});

/* ============================================================
   1. AR シーン初期化
============================================================ */
let scene = new THREE.Scene();
let camera = new THREE.Camera();
scene.add(camera);

let renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.style.position = "absolute";
renderer.domElement.style.top = "0px";
document.body.appendChild(renderer.domElement);
dbg("Three.js renderer ready");

/* AR.js (THREEx) 初期化（あれば使う） */
let arjs = null;
let cam = null;
try {
  if (window.THREEx && THREEx.LocationBased && THREEx.WebcamRenderer) {
    arjs = new THREEx.LocationBased(scene, camera);
    cam = new THREEx.WebcamRenderer(renderer);
    dbg("AR.js THREEx initialized OK");
  } else {
    dbg("AR.js THREEx NOT available (THREEx undefined)");
  }
} catch (e) {
  dbg("AR.js init ERROR: " + e.message);
}

/* ============================================================
   1-2. 冬キャラ（スノーマン）
============================================================ */
let snowman = null;
function createSnowman() {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.SphereGeometry(1.0, 32, 32);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.set(0, -0.5, 0);
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0, 0.7, 0);
  group.add(head);

  // Scarf
  const scarfGeo = new THREE.TorusGeometry(0.7, 0.12, 16, 32);
  const scarfMat = new THREE.MeshStandardMaterial({ color: 0xff5555 });
  const scarf = new THREE.Mesh(scarfGeo, scarfMat);
  scarf.rotation.x = Math.PI / 2;
  scarf.position.set(0, 0.2, 0);
  group.add(scarf);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.18, 0.9, 0.55);
  rightEye.position.set(0.18, 0.9, 0.55);
  group.add(leftEye, rightEye);

  // Nose
  const noseGeo = new THREE.ConeGeometry(0.1, 0.4, 16);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 0.85, 0.7);
  group.add(nose);

  // Lighting
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(2, 4, 3);
  group.add(dirLight);

  const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
  group.add(ambLight);

  // Camera 前方
  group.position.set(0, -0.5, -4);

  snowman = group;
  snowman.visible = false;
  scene.add(snowman);
  dbg("Snowman created");
}
createSnowman();

  { id:"nishi_otsuka", nameJa:"西大塚駅", nameEn:"Nishi-Ōtsuka Station", lat:38.055419, lng:140.064291 },
  { id:"imaizumi", nameJa:"今泉駅", nameEn:"Imaizumi Station", lat:38.056708, lng:140.044168 },
  { id:"tokiniwa", nameJa:"時庭駅", nameEn:"Tokiniwa Station", lat:38.076700, lng:140.030000 },
  { id:"minami_nagai", nameJa:"南長井駅", nameEn:"Minami-Nagai Station", lat:38.097639, lng:140.034556 },
  { id:"nagai_station", nameJa:"長井駅", nameEn:"Nagai Station", lat:38.107183, lng:140.033840 },

  { id:"koguwa", nameJa:"蚕桑駅", nameEn:"Koguwa Station", lat:38.161533, lng:140.046759 },

  { id:"isazawa_kubo_zakura", nameJa:"伊佐沢の久保桜", nameEn:"Isazawa Kubo Zakura", lat:38.120750, lng:140.061100 },
  { id:"kyu_marudai_ogiya", nameJa:"旧丸大扇屋", nameEn:"Former Marudai Ogiya", lat:38.107900, lng:140.034600 },
  { id:"tas_park_hotel", nameJa:"タスパークホテル", nameEn:"Tas Park Hotel", lat:38.107310, lng:140.039510 }

/* ============================================================

============================================================ */

  kyu_marudai_ogiya:"舟運で栄えた呉服商の屋敷です。",
  tas_park_hotel:"飯豊連峰と最上川を望むホテルです。"
};

const spotDescEn = {
  akayu:"The starting point of the Flower Nagai Line and a gateway to Akayu Onsen.",
  nanyo_shiyakusho:"The nearest station to Nanyo City Hall.",
  miyauchi:"The station serving the historic Miyauchi district near Kumano-taisha Shrine.",
  orihata:"A quiet rural station near the Mogami River.",
  ringo:"A station in a major fruit-growing district.",
  nishi_otsuka:"A local station in Kawanishi Town.",
  imaizumi:"An interchange with the JR Yonesaka Line.",
  tokiniwa:"A peaceful rural station.",
  minami_nagai:"A gateway to southern Nagai.",
  nagai_station:"The central station of the Flower Nagai Line.",
  ayame_koen:"The nearest station to Nagai Iris Garden.",
  uzen_narita:"A rural station serving Narita district.",

  koguwa:"A quiet mountain-area station.",

  shikinosato:"A scenic station near Arato.",

  michi_no_eki_kawa_no_minato:"A riverside roadside station.",

  tas_park_hotel:"A hotel with views of the Iide mountains."
};

/* ============================================================
   4. 音声ファイルマップ
============================================================ */
const spotAudioMapJa = {
  nagai_station:"audio/nagai_station_history_ja.mp3",
  michi_no_eki_kawa_no_minato:"audio/michi_ja.mp3",
  nagai_ayame_park:"audio/ayame_ja.mp3",
  isazawa_kubo_zakura:"audio/kubo_zakura_ja.mp3",
  kyu_marudai_ogiya:"audio/marudai_ogiya_ja.mp3",
  tas_park_hotel:"audio/tas_park_hotel_ja.mp3"
};
const spotAudioMapEn = {
  nagai_station:"audio/nagai_station_history_en.mp3",
  michi_no_eki_kawa_no_minato:"audio/michi_en.mp3",
  nagai_ayame_park:"audio/ayame_en.mp3",
  isazawa_kubo_zakura:"audio/kubo_zakura_en.mp3",
  kyu_marudai_ogiya:"audio/marudai_ogiya_en.mp3",
  tas_park_hotel:"audio/tas_park_hotel_en.mp3"
};

/* ============================================================
   5. 距離計算
============================================================ */
function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ============================================================
   6. 最寄判定 + スノーマン表示
============================================================ */
let currentLang = "ja";
let currentAudioUrl = null;
let lastLat = null;
let lastLng = null;

const audioBtn = document.getElementById("audioGuideBtn");
const audioElement = document.getElementById("spotAudio");

function updateAudioButtonLabel() {
  if (!currentAudioUrl) {
    audioBtn.textContent = currentLang === "ja" ? "音声なし" : "No audio";
    audioBtn.disabled = true;
  } else {
    audioBtn.textContent = currentLang === "ja" ? "▶ 音声ガイド" : "▶ Audio Guide";
    audioBtn.disabled = false;
  }
}

function updateNearest(lat, lng) {
  lastLat = lat;
  lastLng = lng;

  dbg(`updateNearest: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);

  let nearest = null;
  let minDist = 999999;

  nagaiArSpots.forEach(sp => {
    const d = getDistanceMeters(lat, lng, sp.lat, sp.lng);
    if (d < minDist) {
      minDist = d;
      nearest = sp;
    }
  });

  if (!nearest) {
    dbg("nearest not found");
    return;
  }

  dbg(`nearest: id=${nearest.id}, dist=${minDist.toFixed(1)}m`);

  // 長井駅 300m以内でスノーマン表示
  if (snowman) {
    snowman.visible = (nearest.id === "nagai_station" && minDist < 300);
  }

  // 説明プレート
  const plate = document.getElementById("spotPlate");
  const titleEl = document.getElementById("spotTitle");
  const contentEl = document.getElementById("spotScrollContent");

  plate.style.display = "block";
  titleEl.textContent =
      currentLang === "ja" ? nearest.nameJa : nearest.nameEn;
  contentEl.textContent =
      currentLang === "ja" ? (spotDescJa[nearest.id] || "") : (spotDescEn[nearest.id] || "");

  // 再生中の音声を停止
  audioElement.pause();
  audioElement.currentTime = 0;

  // 現在スポットの音声URLだけセット（再生はボタンで）
  currentAudioUrl =
      currentLang === "ja" ? spotAudioMapJa[nearest.id] : spotAudioMapEn[nearest.id];

  updateAudioButtonLabel();
}

/* ============================================================
   7. 音声ガイドボタン
============================================================ */
audioBtn.addEventListener("click", () => {
  if (!currentAudioUrl) {
    dbg("audio button clicked but no url");
    return;
  }
  dbg("play audio: " + currentAudioUrl);

  audioElement.src = currentAudioUrl;
  audioElement.currentTime = 0;

  audioElement.play()
    .then(() => dbg("audio playing"))
    .catch(e => dbg("audio error: " + e.message));
});

/* ============================================================
   8. スクロール（下から上へループ）
============================================================ */
let scrollStart = null;
function animateScroll(ts) {
  if (!scrollStart) scrollStart = ts;
  const win = document.getElementById("spotScrollWindow");
  const con = document.getElementById("spotScrollContent");
  const Hwin = win.clientHeight;
  const Hcon = con.clientHeight;
  const t = Math.min((ts - scrollStart) / 20000, 1);
  const y = (1 - t) * Hwin - Hcon;
  con.style.transform = `translateY(${y}px)`;
  if (t >= 1) scrollStart = ts;
  requestAnimationFrame(animateScroll);
}
requestAnimationFrame(animateScroll);

/* ============================================================
   9. 言語切替
============================================================ */
document.getElementById("lang-switch").addEventListener("click", () => {
  currentLang = currentLang === "ja" ? "en" : "ja";
  dbg("language changed: " + currentLang);

  // 位置が分かっていれば、その位置で再計算
  if (lastLat !== null && lastLng !== null) {
    updateNearest(lastLat, lastLng);
  } else {
    updateAudioButtonLabel();
  }
});

/* ============================================================
   10. GPS 更新
============================================================ */
if (!("geolocation" in navigator)) {
  dbg("このブラウザでは位置情報が使えません");
} else {
  dbg("GPS 要求を開始します");
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      dbg(`position: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);
      updateNearest(lat, lng);
    },
    (err) => {
      dbg(`GPS エラー: ${err.code} ${err.message}`);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

/* ============================================================
   11. レンダリングループ
============================================================ */
function renderLoop() {
  if (cam) cam.update();
  renderer.render(scene, camera);
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>

</body>
</html>
