<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Nagai AR Guide – Audio Button + Debug Toggle</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

  <!-- AR.js (GPS + Camera) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex-location-only.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }

    /* 言語切替 */
    #lang-switch {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      z-index: 9999;
      cursor: pointer;
    }

    /* デバッグ ON/OFF ボタン */
    #debugToggle {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-size: 12px;
      color: #0f0;
      z-index: 9999;
      cursor: pointer;
      border: 1px solid #0f0;
    }

    /* 下部プレート */
    #spotPlate {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 12px;
      z-index: 9998;
      display: none;
    }

    #spotHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    #spotTitle {
      font-size: 18px;
      font-weight: bold;
    }

    #audioGuideBtn {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      white-space: nowrap;
    }

    #audioGuideBtn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #spotScrollWindow {
      overflow: hidden;
      height: 120px;
    }

    #spotScrollContent {
      white-space: pre-wrap;
      line-height: 1.4;
      transform: translateY(0);
    }

    /* デバッグパネル */
    #debugPanel {
      position: fixed;
      top: 50px;
      left: 10px;
      padding: 6px 8px;
      font-size: 10px;
      line-height: 1.3;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      z-index: 9999;
      max-width: 80vw;
      max-height: 40vh;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

/* ============================================================
   0. デバッグ & エラーキャッチ
============================================================ */
function dbg(msg) {
  const el = document.getElementById("debugPanel");
  if (!el) return;
  const now = new Date().toLocaleTimeString();
  el.textContent = `[${now}] ${msg}\n` + el.textContent;
}
window.onerror = function (msg, src, line, col, err) {
  dbg(`JS ERROR: ${msg} @${line}:${col}`);
};

dbg("script start");

/* デバッグパネル ON/OFF */
let debugVisible = true;
const debugPanelEl = document.getElementById("debugPanel");
document.getElementById("debugToggle").addEventListener("click", () => {
  debugVisible = !debugVisible;
  debugPanelEl.style.display = debugVisible ? "block" : "none";
});

/* ============================================================
   1. AR シーン初期化
============================================================ */
let scene = new THREE.Scene();
let camera = new THREE.Camera();
scene.add(camera);

let renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.style.position = "absolute";
renderer.domElement.style.top = "0px";
document.body.appendChild(renderer.domElement);
dbg("Three.js renderer ready");

/* AR.js (THREEx) 初期化（あれば使う） */
let arjs = null;
let cam = null;
try {
  if (window.THREEx && THREEx.LocationBased && THREEx.WebcamRenderer) {
    arjs = new THREEx.LocationBased(scene, camera);
    cam = new THREEx.WebcamRenderer(renderer);
    dbg("AR.js THREEx initialized OK");
  } else {
    dbg("AR.js THREEx NOT available (THREEx undefined)");
  }
} catch (e) {
  dbg("AR.js init ERROR: " + e.message);
}

/* ============================================================
   1-2. 冬キャラ（スノーマン）
============================================================ */
let snowman = null;
function createSnowman() {
  const group = new THREE.Group();

  // Body
  const bodyGeo = new THREE.SphereGeometry(1.0, 32, 32);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.set(0, -0.5, 0);
  group.add(body);

  // Head
  const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0, 0.7, 0);
  group.add(head);

  // Scarf
  const scarfGeo = new THREE.TorusGeometry(0.7, 0.12, 16, 32);
  const scarfMat = new THREE.MeshStandardMaterial({ color: 0xff5555 });
  const scarf = new THREE.Mesh(scarfGeo, scarfMat);
  scarf.rotation.x = Math.PI / 2;
  scarf.position.set(0, 0.2, 0);
  group.add(scarf);

  // Eyes
  const eyeGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.18, 0.9, 0.55);
  rightEye.position.set(0.18, 0.9, 0.55);
  group.add(leftEye, rightEye);

  // Nose
  const noseGeo = new THREE.ConeGeometry(0.1, 0.4, 16);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xffa500 });
  const nose = new THREE.Mesh(noseGeo, noseMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 0.85, 0.7);
  group.add(nose);

  // Lighting
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(2, 4, 3);
  group.add(dirLight);

  const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
  group.add(ambLight);

  // Camera 前方
  group.position.set(0, -0.5, -4);

  snowman = group;
  snowman.visible = false;
  scene.add(snowman);
  dbg("Snowman created");
}
createSnowman();

/* ============================================================
   5. 距離計算
============================================================ */
function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ============================================================
   6. 最寄判定 + スノーマン表示
============================================================ */
let currentLang = "ja";
let currentAudioUrl = null;
let lastLat = null;
let lastLng = null;

const audioBtn = document.getElementById("audioGuideBtn");
const audioElement = document.getElementById("spotAudio");

function updateAudioButtonLabel() {
  if (!currentAudioUrl) {
    audioBtn.textContent = currentLang === "ja" ? "音声なし" : "No audio";
    audioBtn.disabled = true;
  } else {
    audioBtn.textContent = currentLang === "ja" ? "▶ 音声ガイド" : "▶ Audio Guide";
    audioBtn.disabled = false;
  }
}

function updateNearest(lat, lng) {
  lastLat = lat;
  lastLng = lng;

  dbg(`updateNearest: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);

  let nearest = null;
  let minDist = 999999;

  nagaiArSpots.forEach(sp => {
    const d = getDistanceMeters(lat, lng, sp.lat, sp.lng);
    if (d < minDist) {
      minDist = d;
      nearest = sp;
    }
  });

  if (!nearest) {
    dbg("nearest not found");
    return;
  }

  dbg(`nearest: id=${nearest.id}, dist=${minDist.toFixed(1)}m`);

  // 長井駅 300m以内でスノーマン表示
  if (snowman) {
    snowman.visible = (nearest.id === "nagai_station" && minDist < 300);
  }

  // 説明プレート
  const plate = document.getElementById("spotPlate");
  const titleEl = document.getElementById("spotTitle");
  const contentEl = document.getElementById("spotScrollContent");

  plate.style.display = "block";
  titleEl.textContent =
      currentLang === "ja" ? nearest.nameJa : nearest.nameEn;
  contentEl.textContent =
      currentLang === "ja" ? (spotDescJa[nearest.id] || "") : (spotDescEn[nearest.id] || "");

  // 再生中の音声を停止
  audioElement.pause();
  audioElement.currentTime = 0;

  // 現在スポットの音声URLだけセット（再生はボタンで）
  currentAudioUrl =
      currentLang === "ja" ? spotAudioMapJa[nearest.id] : spotAudioMapEn[nearest.id];

  updateAudioButtonLabel();
}

/* ============================================================
   7. 音声ガイドボタン
============================================================ */
audioBtn.addEventListener("click", () => {
  if (!currentAudioUrl) {
    dbg("audio button clicked but no url");
    return;
  }
  dbg("play audio: " + currentAudioUrl);

  audioElement.src = currentAudioUrl;
  audioElement.currentTime = 0;

  audioElement.play()
    .then(() => dbg("audio playing"))
    .catch(e => dbg("audio error: " + e.message));
});

/* ============================================================
   8. スクロール（下から上へループ）
============================================================ */
let scrollStart = null;
function animateScroll(ts) {
  if (!scrollStart) scrollStart = ts;
  const win = document.getElementById("spotScrollWindow");
  const con = document.getElementById("spotScrollContent");
  const Hwin = win.clientHeight;
  const Hcon = con.clientHeight;
  const t = Math.min((ts - scrollStart) / 20000, 1);
  const y = (1 - t) * Hwin - Hcon;
  con.style.transform = `translateY(${y}px)`;
  if (t >= 1) scrollStart = ts;
  requestAnimationFrame(animateScroll);
}
requestAnimationFrame(animateScroll);

/* ============================================================
   9. 言語切替
============================================================ */
document.getElementById("lang-switch").addEventListener("click", () => {
  currentLang = currentLang === "ja" ? "en" : "ja";
  dbg("language changed: " + currentLang);

  // 位置が分かっていれば、その位置で再計算
  if (lastLat !== null && lastLng !== null) {
    updateNearest(lastLat, lastLng);
  } else {
    updateAudioButtonLabel();
  }
});

/* ============================================================
   10. GPS 更新
============================================================ */
if (!("geolocation" in navigator)) {
  dbg("このブラウザでは位置情報が使えません");
} else {
  dbg("GPS 要求を開始します");
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      dbg(`position: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);
      updateNearest(lat, lng);
    },
    (err) => {
      dbg(`GPS エラー: ${err.code} ${err.message}`);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

/* ============================================================
   11. レンダリングループ
============================================================ */
function renderLoop() {
  if (cam) cam.update();
  renderer.render(scene, camera);
  requestAnimationFrame(renderLoop);
}
renderLoop();
</script>
