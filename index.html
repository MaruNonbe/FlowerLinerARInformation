<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Nagai AR Guide – Debug Simple</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

  <!-- AR.js (GPS + Camera) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex-location-only.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }
    #lang-switch {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      z-index: 9999;
      cursor: pointer;
    }
    #spotPlate {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 12px;
      z-index: 9998;
      display: none;
    }
    #spotTitle {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #spotScrollWindow {
      overflow: hidden;
      height: 120px;
    }
    #spotScrollContent {
      white-space: pre-wrap;
      line-height: 1.4;
      transform: translateY(0);
    }
    /* デバッグパネル */
    #debugPanel {
      position: fixed;
      top: 50px;
      left: 10px;
      padding: 6px 8px;
      font-size: 10px;
      line-height: 1.3;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      z-index: 9999;
      max-width: 80vw;
      max-height: 40vh;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="lang-switch">日本語 / English</div>
<div id="debugPanel">GPS: waiting...</div>

<!-- 下部説明プレート -->
<div id="spotPlate">
  <div id="spotTitle"></div>
  <div id="spotScrollWindow">
    <div id="spotScrollContent"></div>
  </div>
</div>

<script>
/* ============================================================
   0. デバッグ & エラー表示
============================================================ */
function dbg(msg) {
  const el = document.getElementById("debugPanel");
  if (!el) return;
  const now = new Date().toLocaleTimeString();
  el.textContent = `[${now}] ${msg}\n` + el.textContent;
}

window.onerror = function (msg, src, line, col, err) {
  dbg("JS ERROR: " + msg + " @" + line + ":" + col);
};

dbg("script start");

/* ============================================================
   1. シーン初期化
============================================================ */
const scene  = new THREE.Scene();
const camera = new THREE.Camera();
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.style.position = "absolute";
renderer.domElement.style.top = "0px";
document.body.appendChild(renderer.domElement);

dbg("Three.js renderer ready");

/* === AR.js (THREEx) 初期化（失敗しても落ちないように） === */
let arLocation = null;
let arCam      = null;

try {
  if (window.THREEx && THREEx.LocationBased && THREEx.WebcamRenderer) {
    arLocation = new THREEx.LocationBased(scene, camera);
    arCam      = new THREEx.WebcamRenderer(renderer);
    dbg("AR.js THREEx initialized");
  } else {
    dbg("THREEx.* not available – AR.js not active");
  }
} catch (e) {
  dbg("AR.js init error: " + e.message);
}

/* ============================================================
   2. 冬キャラ（スノーマン）
============================================================ */
let snowman = null;

(function createSnowman() {
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1.0, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  body.position.set(0, -0.5, 0);
  g.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  head.position.set(0, 0.7, 0);
  g.add(head);

  const scarf = new THREE.Mesh(
    new THREE.TorusGeometry(0.7, 0.12, 16, 32),
    new THREE.MeshStandardMaterial({ color: 0xff5555 })
  );
  scarf.rotation.x = Math.PI / 2;
  scarf.position.set(0, 0.2, 0);
  g.add(scarf);

  const eyeGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-0.18, 0.9, 0.55);
  eyeR.position.set( 0.18, 0.9, 0.55);
  g.add(eyeL, eyeR);

  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.1, 0.4, 16),
    new THREE.MeshStandardMaterial({ color: 0xffa500 })
  );
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 0.85, 0.7);
  g.add(nose);

  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(2, 4, 3);
  g.add(dir);
  const amb = new THREE.AmbientLight(0xffffff, 0.4);
  g.add(amb);

  g.position.set(0, -0.5, -4);
  g.visible = false;

  snowman = g;
  scene.add(snowman);
  dbg("snowman created");
})();

/* ============================================================
   3. Flower 長井線 + 観光スポット GPS
============================================================ */

  { id:"orihata", nameJa:"おりはた駅", nameEn:"Orihata Station", lat:38.066517, lng:140.122428 },
  { id:"ringo", nameJa:"梨郷駅", nameEn:"Ringō Station", lat:38.057281, lng:140.098111 },
  { id:"nishi_otsuka", nameJa:"西大塚駅", nameEn:"Nishi-Ōtsuka Station", lat:38.055419, lng:140.064291 },
  { id:"imaizumi", nameJa:"今泉駅", nameEn:"Imaizumi Station", lat:38.056708, lng:140.044168 },
  { id:"tokiniwa", nameJa:"時庭駅", nameEn:"Tokiniwa Station", lat:38.076700, lng:140.030000 },
  { id:"minami_nagai", nameJa:"南長井駅", nameEn:"Minami-Nagai Station", lat:38.097639, lng:140.034556 },
  { id:"nagai_station", nameJa:"長井駅", nameEn:"Nagai Station", lat:38.107183, lng:140.033840 },
  { id:"ayame_koen", nameJa:"あやめ公園駅", nameEn:"Ayame-Kōen Station", lat:38.114194, lng:140.032778 },

  { id:"shirousagi", nameJa:"白兎駅", nameEn:"Shirousagi Station", lat:38.149933, lng:140.041083 },
  { id:"koguwa", nameJa:"蚕桑駅", nameEn:"Koguwa Station", lat:38.161533, lng:140.046759 },

  { id:"isazawa_kubo_zakura", nameJa:"伊佐沢の久保桜", nameEn:"Isazawa Kubo Zakura", lat:38.120750, lng:140.061100 },
  { id:"kyu_marudai_ogiya", nameJa:"旧丸大扇屋", nameEn:"Former Marudai Ogiya", lat:38.107900, lng:140.034600 },
  { id:"tas_park_hotel", nameJa:"タスパークホテル", nameEn:"Tas Park Hotel", lat:38.107310, lng:140.039510 }
];

/* ============================================================

============================================================ */

  michi_no_eki_kawa_no_minato:"最上川沿いの物産館と観光案内の拠点です。",
  nagai_ayame_park:"500種100万本のあやめが咲く名所です。",

  kyu_marudai_ogiya:"舟運で栄えた呉服商の屋敷です。",
  tas_park_hotel:"飯豊連峰と最上川を望むホテルです。"
};

const spotDescEn = {
  akayu:"The starting point of the Flower Nagai Line and a gateway to Akayu Onsen.",
  nanyo_shiyakusho:"The nearest station to Nanyo City Hall.",
  miyauchi:"The station serving the historic Miyauchi district near Kumano-taisha Shrine.",
  orihata:"A quiet rural station near the Mogami River.",
  ringo:"A station in a major fruit-growing district.",
  nishi_otsuka:"A local station in Kawanishi Town.",

  michi_no_eki_kawa_no_minato:"A riverside roadside station.",

  tas_park_hotel:"A hotel with views of the Iide mountains."

/* ============================================================
   5. 音声ファイルマップ（必要なものだけ）
============================================================ */
const spotAudioMapJa = {
  nagai_station:"audio/nagai_station_history_ja.mp3",
  michi_no_eki_kawa_no_minato:"audio/michi_ja.mp3",
  nagai_ayame_park:"audio/ayame_ja.mp3",
  isazawa_kubo_zakura:"audio/kubo_zakura_ja.mp3",
  kyu_marudai_ogiya:"audio/marudai_ogiya_ja.mp3",
  tas_park_hotel:"audio/tas_park_hotel_ja.mp3"
};

const spotAudioMapEn = {
  nagai_station:"audio/nagai_station_history_en.mp3",
  michi_no_eki_kawa_no_minato:"audio/michi_en.mp3",
  nagai_ayame_park:"audio/ayame_en.mp3",
  isazawa_kubo_zakura:"audio/kubo_zakura_en.mp3",
  kyu_marudai_ogiya:"audio/marudai_ogiya_en.mp3",
  tas_park_hotel:"audio/tas_park_hotel_en.mp3"
};

/* ============================================================
   6. 距離計算 & 最寄り判定
============================================================ */
function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

let currentLang = "ja";
let activeAudio = null;

function updateNearest(lat, lng) {
  dbg(`updateNearest: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);

  let nearest = null;
  let minDist = Infinity;
  nagaiArSpots.forEach(sp => {
    const d = getDistanceMeters(lat, lng, sp.lat, sp.lng);
    if (d < minDist) {
      minDist = d;
      nearest = sp;
    }
  });

  if (!nearest) {
    dbg("nearest not found");
    return;
  }

  dbg(`nearest: ${nearest.id}, dist=${minDist.toFixed(1)}m`);

  // スノーマン：長井駅 300m 以内
  if (snowman) {
    snowman.visible = (nearest.id === "nagai_station" && minDist < 300);
  }

  // プレート表示
  document.getElementById("spotPlate").style.display = "block";
  document.getElementById("spotTitle").textContent =
    currentLang === "ja" ? nearest.nameJa : nearest.nameEn;

  document.getElementById("spotScrollContent").textContent =
    currentLang === "ja"
      ? (spotDescJa[nearest.id] || "")
      : (spotDescEn[nearest.id] || "");

  // 音声
  if (activeAudio) activeAudio.pause();

  const audioUrl =
    currentLang === "ja" ? spotAudioMapJa[nearest.id] : spotAudioMapEn[nearest.id];

  if (audioUrl) {
    dbg("play audio: " + audioUrl);
    activeAudio = new Audio(audioUrl);
    activeAudio.play().catch(e => dbg("audio error: " + e.message));
  } else {
    dbg("audio not set for " + nearest.id);
  }
}

/* ============================================================
   7. テキスト自動スクロール
============================================================ */
let scrollStart = null;
function animateScroll(ts) {
  if (!scrollStart) scrollStart = ts;
  const win = document.getElementById("spotScrollWindow");
  const con = document.getElementById("spotScrollContent");
  const Hwin = win.clientHeight;
  const Hcon = con.clientHeight;
  const t = Math.min((ts - scrollStart) / 20000, 1);
  const y = (1 - t) * Hwin - Hcon;
  con.style.transform = `translateY(${y}px)`;
  if (t >= 1) scrollStart = ts;
  requestAnimationFrame(animateScroll);
}
requestAnimationFrame(animateScroll);

/* ============================================================
   8. 言語切替
============================================================ */
document.getElementById("lang-switch").addEventListener("click", () => {
  currentLang = currentLang === "ja" ? "en" : "ja";
  dbg("language: " + currentLang);
});

/* ============================================================
   9. GPS 取得（watchPosition）
============================================================ */
if (!("geolocation" in navigator)) {
  dbg("このブラウザでは位置情報が使えません");
} else {
  dbg("GPS watchPosition start");
  navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      dbg(`position: lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)}`);
      updateNearest(lat, lng);
    },
    err => {
      dbg(`GPS error: code=${err.code} message=${err.message}`);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}

/* ============================================================
   10. レンダリングループ
============================================================ */
function renderLoop() {
  if (arCam && arCam.update) {
    arCam.update();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(renderLoop);
}
renderLoop();

dbg("script end");

</script>
</body>
